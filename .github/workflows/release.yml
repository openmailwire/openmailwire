name: release

on:
  push:
    tags: ["v*"]

# Each job asks only for what it needs. Every action is pinned by commit SHA
# (the version is in the comment).
permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the provenance with Sigstore
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest Go 1.27 patch release, never the patch named in go.mod.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Everything is written outside the checkout, so the tree stays
          # clean and the binaries record vcs.modified=false.
          build="$RUNNER_TEMP/build"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$build" "$dist"
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; echo "the checkout is not clean"; exit 1; fi
          version="${TAG#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="openmailwire_${version}_${os}_${arch}"
            mkdir -p "$build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" -o "$build/$name/openmailwire" ./cmd/openmailwire
            cp LICENSE README.md "$build/$name/"
            tar -C "$build" -czf "$dist/$name.tar.gz" "$name"
          done
          bin="$build/openmailwire_${version}_linux_amd64/openmailwire"
          go version -m "$bin"
          go version -m "$bin" | grep -q 'vcs.modified=false' || { echo "the binary was built from a modified tree"; exit 1; }
          (cd "$dist" && sha256sum ./*.tar.gz | sed 's# \./# #' > checksums.txt)
          echo "DIST=$dist" >> "$GITHUB_ENV"
      # Signed (Sigstore) SLSA provenance for every archive and for
      # checksums.txt. Verify with:
      #   gh attestation verify openmailwire_<version>_linux_amd64.tar.gz -R openmailwire/openmailwire
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.DIST }}/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The attestation bundle travels with the release, for offline
          # verification: gh attestation verify <file> --bundle provenance.sigstore.json …
          cp "$BUNDLE" "$DIST/provenance.sigstore.json"
          # Notes: only this version's section of CHANGELOG.md.
          awk -v tag="## ${TAG}" 'index($0, tag) == 1 {p = 1; next} /^## / && p {exit} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          gh release upload "$TAG" "$DIST"/* --clobber

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the provenance with Sigstore
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      # Verify with: gh attestation verify oci://ghcr.io/openmailwire/openmailwire:<tag> -R openmailwire/openmailwire
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
