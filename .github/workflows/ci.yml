name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openmailwire
          POSTGRES_PASSWORD: openmailwire
          POSTGRES_DB: openmailwire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openmailwire"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
        env:
          OMW_TEST_DATABASE_URL: postgres://openmailwire:openmailwire@localhost:5432/openmailwire_test?sslmode=disable
      - run: docker build -t openmailwire:ci .
